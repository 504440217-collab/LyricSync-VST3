<style>

    --accent:#5ce1c1; --accent2:#3aa88f; --warn:#ffb86b; --track:#2b3247;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));
       color:var(--text);font-family:"Microsoft YaHei UI","PingFang SC","Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:min(1040px,100%)}
  .banner{display:flex;gap:10px;align-items:center;background:rgba(255,184,107,.09);
          border:1px solid rgba(255,184,107,.3);color:var(--warn);border-radius:12px;
          padding:10px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
  .banner b{color:#ffd6a3}
  .plugin{background:linear-gradient(160deg,#151a26,#10131c);border:1px solid var(--edge);
          border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  header{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid rgba(90,105,145,.22)}
  .logo{display:flex;align-items:flex-end;gap:4px;height:28px}
  .logo i{display:block;width:7px;border-radius:4px;background:var(--accent)}
  .logo i:first-child{height:26px}.logo i:last-child{height:13px;opacity:.45}
  .brand{font-size:19px;font-weight:700;letter-spacing:.3px}
  .sub{font-size:11px;color:var(--faint);margin-top:3px}
  .clock{margin-left:auto;text-align:right}
  #lang{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:9px;
        padding:6px 8px;font-size:12px;font-family:inherit;cursor:pointer;outline:none}
  #lang:hover{border-color:var(--accent2)}
  #clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
  #status{font-size:11px;color:var(--dim);margin-top:2px}
  .stage{margin:18px 22px;height:290px;background:var(--card);border:1px solid rgba(90,105,145,.32);
         border-radius:16px;position:relative;display:flex;flex-direction:column;
         align-items:center;justify-content:center;overflow:hidden;padding:18px 30px}
  .stage::before{content:"CURRENT LINE";position:absolute;left:22px;top:16px;
                 font-size:10px;letter-spacing:2px;color:var(--faint)}
  #counter{position:absolute;right:22px;top:14px;font-size:11px;color:var(--faint)}
  .line{width:100%;text-align:center;white-space:pre-wrap;word-break:break-word;transition:opacity .2s}
  #prev{font-size:17px;color:rgba(154,165,191,.55);height:52px;display:flex;align-items:center;justify-content:center}
  #current{font-size:38px;font-weight:700;line-height:1.45;color:var(--accent);min-height:96px;
           display:flex;align-items:center;justify-content:center;text-shadow:0 0 28px rgba(92,225,193,.22)}
  #current .sung{color:var(--accent)}#current .todo{color:var(--text)}
  #trans{font-size:14px;color:var(--dim);min-height:22px;text-align:center}
  #next{font-size:17px;color:rgba(154,165,191,.45);height:52px;display:flex;align-items:center;justify-content:center}
  .innerbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:190px;height:3px;
            background:var(--track);border-radius:3px;overflow:hidden}
  .innerbar span{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
  .controls{padding:0 22px 20px}
  .seekrow{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
  .seekrow input{flex:1}
  input[type=range]{-webkit-appearance:none;height:5px;border-radius:5px;background:var(--track);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;

        border-radius:9px;padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  button:hover,label.filebtn:hover{border-color:var(--accent2);background:#232a3d}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#06120f;font-weight:700;min-width:76px}
  button.primary:hover{background:var(--accent)}

  .hint{font-size:11px;color:var(--faint);margin-left:auto}
  .metarow{display:flex;justify-content:space-between;gap:12px;margin-top:14px;

function parseClock(s){
  s = s.trim().replace(/,/g,'.');
  if(!/^[\d:+.\- ]+$/.test(s)) return null;
  const p = s.split(':').map(Number);
  let v = 0;
  if(p.length===3) v = p[0]*3600+p[1]*60+p[2];
  else if(p.length===2) v = p[0]*60+p[1];
  else if(p.length===1) v = p[0];
  else return null;
  return (isFinite(v)&&v>=0)?v:null;
}

function parseLyrics(raw){
  let text = raw.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const lines=[], meta={title:'',artist:'',offsetMs:0};
  let format='LRC', karaoke=0, plain=[];

  if(text.includes('-->')){
    format='SRT';
    const rows=text.split('\n'); let pending=null, buf='';
    const flush=()=>{ if(pending!==null&&buf.trim()) lines.push({time:pending,text:buf.trim(),chars:[]}); pending=null;buf=''; };
    for(let r of rows){
      const ln=r.trim();
      if(ln.includes('-->')){ flush(); const t=parseClock(ln.split('-->')[0]); if(t!==null) pending=t; continue; }
      if(!ln || /^\d+$/.test(ln) || ln.startsWith('WEBVTT')){ flush(); continue; }
      buf += (buf?'  ':'') + ln.replace(/<[^>]*>/g,'');
    }
    flush();
  } else {
    for(let row of text.split('\n')){
      let s=row.trim(); if(!s||s.startsWith('#')) continue;
      const stamps=[]; let tags=false;
      while(s.startsWith('[')){
        const close=s.indexOf(']'); if(close<0) break;
        const tag=s.substring(1,close).trim();
        const t=parseClock(tag);
        if(t!==null) stamps.push(t);
        else if(/^(ar|ti|al|by|offset|length|re|ve):/i.test(tag)){
          const key=tag.split(':')[0].toLowerCase(), val=tag.substring(tag.indexOf(':')+1).trim();
          if(key==='ti')meta.title=val; if(key==='ar')meta.artist=val;
          if(key==='offset')meta.offsetMs=parseFloat(val)||0;
        } else break;
        s=s.substring(close+1); tags=true;
      }
      if(!stamps.length){ if(s.trim())plain.push(s.trim()); else if(!tags)plain.push(row.trim()); continue; }
      s=s.trim(); if(!s)continue;

      // 抽出 <mm:ss.xx> 逐字锚点
      let clean='', anchors=[];
      for(let i=0;i<s.length;){
        if(s[i]==='<'){
          const close=s.indexOf('>',i+1);
          if(close>0){ const t=parseClock(s.substring(i+1,close)); if(t!==null){ anchors.push([clean.length,t]); i=close+1; continue; } }
        }
        clean+=s[i++];
      }
      let chars=[];
      if(anchors.length&&clean.length){
        karaoke++;
        const a=[[0,stamps[0]]];
        for(const [idx,t] of anchors) if(idx>0&&idx<=clean.length&&idx>a[a.length-1][0]&&t>a[a.length-1][1]) a.push([idx,t]);
        if(a.length>1){
          for(let ci=0;ci<clean.length;ci++){
            let k=0; while(k+1<a.length&&a[k+1][0]<=ci)k++;
            let abs=a[k][1];
            if(k+1<a.length){ const di=a[k+1][0]-a[k][0], dt=a[k+1][1]-a[k][1]; if(di>0)abs+=dt*(ci-a[k][0])/di; }
            else { const prev=a[a.length-2],last=a[a.length-1];
                   const per=last[0]>prev[0]?(last[1]-prev[1])/(last[0]-prev[0]):0.08;
                   abs=last[1]+per*(ci-last[0]); }
            chars.push(Math.max(0,abs-stamps[0]));
          }
        }
      }
      for(const t of stamps) lines.push({time:t,text:clean,chars:[...chars],translation:''});
    }
    if(!lines.length&&plain.length){ format='TXT'; plain.forEach((t,i)=>lines.push({time:i*4,text:t,chars:[],translation:''})); }
  }

  lines.sort((a,b)=>a.time-b.time);
  for(let i=1;i<lines.length;){
    const p=lines[i-1],c=lines[i];
    if(Math.abs(c.time-p.time)<0.004&&!p.translation&&!p.chars.length&&!c.chars.length&&c.text!==p.text){p.translation=c.text;lines.splice(i,1);}
    else i++;
  }
  if(meta.offsetMs) lines.forEach(l=>l.time=Math.max(0,l.time+meta.offsetMs/1000));
  if(karaoke)format='Enhanced LRC';
  return {lines,meta,format,karaoke};
}

let lang='zh', T=TXT.zh;

const $=id=>document.getElementById(id);
const fmt=s=>{const neg=s<0;s=Math.abs(s);const m=Math.floor(s/60);
  return (neg?'-':'')+String(m).padStart(2,'0')+':'+(s-m*60).toFixed(3).padStart(6,'0');};
const duration=()=>Math.max(10,(doc.lines.length?doc.lines[doc.lines.length-1].time+4:60));
const lineEnd=i=>i+1<doc.lines.length?Math.max(doc.lines[i].time+.01,doc.lines[i+1].time):doc.lines[i].time+4;
function indexAt(time){let lo=0,hi=doc.lines.length;while(lo<hi){const mid=(lo+hi)>>1;if(doc.lines[mid].time<=time)lo=mid+1;else hi=mid;}return lo-1;}

function render(){
  const idx=indexAt(t);
  const cur=idx>=0?doc.lines[idx]:null;
  $('prev').textContent = idx>0?doc.lines[idx-1].text:(idx===-1?T.intro:'');
  $('next').textContent = (idx<0?0:idx+1)<doc.lines.length?doc.lines[idx<0?0:idx+1].text:'';
  $('trans').textContent = cur?(cur.translation||''):'';

  if(cur){
    const arr=[...cur.text];
    let sung=-1;
    if(cur.chars.length){ sung=0; for(const off of cur.chars) if(t-cur.time>=off) sung++; else break; }
    if(cur.chars.length && arr.length){
      $('current').innerHTML=arr.map((ch,i)=>`<span class="${i<sung?'sung':'todo'}">${ch.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`).join('');
    }else{
      $('current').textContent=cur.text;
    }
    const f=Math.max(0,Math.min(1,(t-cur.time)/Math.max(.01,lineEnd(idx)-cur.time)));
    $('innerfill').style.width=(f*100)+'%';
  }else{
    $('current').innerHTML='<span style="color:var(--faint)">· · ·</span>';
    $('innerfill').style.width='0%';
  }

  if(idx!==lastIdx){ $('current').animate([{opacity:.5,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220,easing:'ease-out'}); lastIdx=idx; }
  $('counter').textContent=Math.max(0,idx+1)+' / '+doc.lines.length;
  $('clock').textContent=fmt(t);
  $('seeklabel').textContent=fmt(t);
  if(!dragging)$('seek').value=t;
  $('seek').max=duration();
  $('status').textContent=(playing?T.statusPlay:T.statusStop)+' · '+T.preview;
  const ppq=t*2, bar=Math.floor(ppq/4)+1, beat=ppq-(bar-1)*4+1, tick=Math.floor((beat-Math.floor(beat))*960);
  $('meta').textContent=`${T.bar} ${bar}.${Math.floor(beat)}.${String(tick).padStart(3,'0')} · 120.0 BPM · 4/4`;
  $('fileinfo').textContent=fileLabel+' · '+doc.format+' · '+doc.lines.length+' '+T.lines+(doc.karaoke?' · '+T.word:'');
}

function applyLang(v){
  lang=v;T=TXT[v];
  document.documentElement.lang=(v==='zh'?'zh-CN':'en');
  document.title=T.title;
  $('bannertext').innerHTML=T.banner;
  $('footer').innerHTML=T.footer;
  $('textarea').placeholder=T.placeholder;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[el.dataset.t]||el.dataset.t;});
  $('play').textContent=playing?T.pause:T.play;
  if(builtinKey){
    const [text,label]=SAMPLES[builtinKey][v];
    doc=parseLyrics(text);currentRaw=text;fileLabel=label;lastIdx=-2;
  }
  render();
}

function flash(msg){const f=$('flash');f.textContent=msg;f.classList.add('show');clearTimeout(f._t);f._t=setTimeout(()=>f.classList.remove('show'),1100);}
function jump(v,msg){t=Math.max(0,Math.min(duration(),v));last=performance.now();if(msg)flash(T.jumped+fmt(t));render();}

function load(text,label){
  const d=parseLyrics(text);
  if(!d.lines.length){flash(T.empty);return;}
  doc=d;currentRaw=text;fileLabel=label;t=0;lastIdx=-2;last=performance.now();render();
}
function loadSample(key){builtinKey=key;const [text,label]=SAMPLES[key][lang];load(text,label);}
async function readFile(f){
  const buf=await f.arrayBuffer(), b=new Uint8Array(buf);
  let txt;
  if(b[0]===0xFF&&b[1]===0xFE){ txt=new TextDecoder('utf-16le').decode(buf.slice(2)); }
  else{
    try{ txt=new TextDecoder('utf-8',{fatal:true}).decode(buf); }
    catch(e){ try{ txt=new TextDecoder('gbk').decode(buf); }catch(_){ txt=new TextDecoder('utf-8').decode(buf); } }
  }
  builtinKey=null;load(txt,f.name);
}
function loop(now){
  const dt=last?Math.min(.25,(now-last)/1000):0;last=now;
  if(playing&&!dragging){t+=dt;if(t>=duration()){t=duration();playing=false;$('play').textContent=T.play;}}
  render();requestAnimationFrame(loop);}

$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?T.pause:T.play;last=performance.now();};
$('m5').onclick=()=>jump(t-5,'jump'); $('p5').onclick=()=>jump(t+5,'jump');
$('rand').onclick=()=>jump(Math.random()*duration(),'jump');
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(Number(b.dataset.jump),'jump'));
$('seek').addEventListener('pointerdown',()=>dragging=true);
$('seek').addEventListener('pointerup',()=>{dragging=false;jump(Number($('seek').value));});
$('seek').addEventListener('input',()=>{t=Number($('seek').value);dragging=true;render();});
$('seek').addEventListener('change',()=>{dragging=false;jump(Number($('seek').value));});
$('sample').onclick=()=>loadSample('demo');
$('karaoke').onclick=()=>loadSample('karaoke');
$('srt').onclick=()=>loadSample('srt');
$('file').onchange=e=>{const f=e.target.files[0];if(f)readFile(f);};
$('paste').onclick=()=>{$('editor').style.display='block';$('textarea').value=currentRaw;};
$('apply').onclick=()=>{builtinKey=null;load($('textarea').value,T.labelPaste);$('editor').style.display='none';};
$('cancel').onclick=()=>{$('editor').style.display='none';};
$('lang').onchange=e=>applyLang(e.target.value);
const dz=$('dropzone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--accent)';});
dz.addEventListener('dragleave',()=>dz.style.borderColor='');
dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='';const f=e.dataTransfer.files[0];if(f)readFile(f);});

applyLang('zh');requestAnimationFrame(loop);
</script>
</body>
</html>
